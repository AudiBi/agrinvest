# Exemple de déploiement : copier .env.example en .env, renseigner les secrets, puis `docker compose up -d`
services:
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://agrinvest:${POSTGRES_PASSWORD}@db:5432/agrinvest
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agrinvest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agrinvest
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrinvest"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  logs:
