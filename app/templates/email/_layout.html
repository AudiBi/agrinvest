<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; color: #333; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; border-radius: 8px; padding: 30px; }
        h1 { color: #2e7d32; }
        p { font-size: 16px; line-height: 1.5; }
        .button { display: inline-block; margin-top: 16px; padding: 12px 20px; background-color: #2e7d32;
                  color: white !important; text-decoration: none; border-radius: 5px; }
        .footer { margin-top: 30px; font-size: 12px; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        {% block body %}{% endblock %}
        <div class="footer">© AgriInvest Haïti — Tous droits réservés</div>
    </div>
</body>
</html>
