{% extends 'base.html' %}

{% block title %}Inscription - AgriInvest Haïti{% endblock %}

{% block extra_css %}
<style>
    .register-card {
        background: white;
        border-radius: 24px;
        box-shadow: var(--box-shadow-hover);
        padding: 40px;
        max-width: 600px;
        margin: 0 auto;
    }
    
    .form-control-custom {
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        padding: 12px 15px;
        transition: all 0.3s;
    }
    
    .form-control-custom:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(46,125,50,0.1);
    }
    
    .btn-register {
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        font-weight: 600;
    }
    
    .role-selector {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
    }
    
    .role-option {
        flex: 1;
        padding: 15px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s;
    }
    
    .role-option.selected {
        border-color: var(--primary-color);
        background: #E8F5E9;
    }
    
    .role-option i {
        font-size: 24px;
        margin-bottom: 8px;
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="register-card">
        <div class="text-center mb-4">
            <i class="fas fa-seedling fa-3x text-success"></i>
            <h2 class="mt-3">Inscription</h2>
            <p class="text-muted">Rejoignez la communauté AgriInvest Haïti</p>
        </div>
        
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="role-selector">
                <div class="role-option" data-role="investor">
                    <i class="fas fa-chart-line"></i>
                    <div>Investisseur</div>
                </div>
                <div class="role-option" data-role="farmer">
                    <i class="fas fa-tractor"></i>
                    <div>Agriculteur</div>
                </div>
            </div>
            <input type="hidden" name="role" id="role" value="investor">
            
            <div class="row g-3">
                <div class="col-12">
                    <input type="text" name="name" class="form-control form-control-custom" placeholder="Nom complet" required>
                </div>
                <div class="col-12">
                    <input type="email" name="email" class="form-control form-control-custom" placeholder="Email" required>
                </div>
                <div class="col-12">
                    <input type="tel" name="phone" class="form-control form-control-custom" placeholder="Téléphone">
                </div>
                <div class="col-md-6">
                    <input type="password" name="password" class="form-control form-control-custom" placeholder="Mot de passe" required>
                </div>
                <div class="col-md-6">
                    <input type="password" name="confirm_password" class="form-control form-control-custom" placeholder="Confirmer mot de passe" required>
                </div>
                <div class="col-12">
                    <select name="country" class="form-control form-control-custom">
                        <option value="HT">🇭🇹 Haïti</option>
                        <option value="US">🇺🇸 États-Unis</option>
                        <option value="CA">🇨🇦 Canada</option>
                        <option value="FR">🇫🇷 France</option>
                        <option value="DO">🇩🇴 République dominicaine</option>
                    </select>
                </div>
            </div>
            
            <div class="form-check mt-3">
                <input type="checkbox" class="form-check-input" id="terms" required>
                <label class="form-check-label small" for="terms">
                    J'accepte les <a href="{{ url_for('main.terms') }}" target="_blank">conditions d'utilisation</a>
                </label>
            </div>
            
            <button type="submit" class="btn btn-register text-white mt-4">
                <i class="fas fa-user-plus me-2"></i>S'inscrire
            </button>
        </form>
        
        <div class="text-center mt-4">
            <p class="mb-0">Déjà inscrit ? <a href="{{ url_for('main.login') }}" class="text-success">Se connecter</a></p>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('.role-option').forEach(opt => {
        opt.addEventListener('click', function() {
            document.querySelectorAll('.role-option').forEach(o => o.classList.remove('selected'));
            this.classList.add('selected');
            document.getElementById('role').value = this.dataset.role;
        });
    });
</script>
{% endblock %}
