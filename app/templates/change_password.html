{% extends 'base.html' %}

{% block title %}Changer le mot de passe - AgriInvest Haïti{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Changer le mot de passe</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label" for="current_password">Mot de passe actuel</label>
                            <input type="password" id="current_password" name="current_password"
                                   class="form-control" autocomplete="current-password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="new_password">Nouveau mot de passe</label>
                            <input type="password" id="new_password" name="new_password"
                                   class="form-control" autocomplete="new-password" minlength="8" required>
                            <small class="text-muted">8 caractères minimum, avec une majuscule, une minuscule et un chiffre.</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="confirm_password">Confirmer le nouveau mot de passe</label>
                            <input type="password" id="confirm_password" name="confirm_password"
                                   class="form-control" autocomplete="new-password" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Enregistrer</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
