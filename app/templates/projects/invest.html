{% extends 'base.html' %}

{% block title %}Investir - {{ project.title }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Investir dans {{ project.title }}</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Montant (HTG)</label>
                            <input type="number" name="amount" class="form-control" 
                                   min="{{ project.min_investment }}" 
                                   step="100" required>
                            <small class="text-muted">
                                Minimum: {{ "{:,.0f}".format(project.min_investment).replace(",", " ") }} HTG
                            </small>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Méthode de paiement</label>
                            <select name="payment_method" class="form-select" required>
                                <option value="stripe">Carte bancaire (Stripe)</option>
                                <option value="moncash">MonCash</option>
                                <option value="cash">Paiement en espèces</option>
                            </select>
                        </div>
                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" name="is_anonymous" class="form-check-input" id="anonymous">
                            <label class="form-check-label" for="anonymous">
                                Investir anonymement
                            </label>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Message (optionnel)</label>
                            <textarea name="message" class="form-control" rows="3"></textarea>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100">
                            <i class="fas fa-check-circle"></i> Confirmer l'investissement
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
