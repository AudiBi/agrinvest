{% extends 'base.html' %}

{% block title %}Nouvelle mise à jour - {{ project.title }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Nouvelle mise à jour — {{ project.title }}</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label" for="title">Titre</label>
                            <input type="text" id="title" name="title" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="title_ht">Titre (créole, optionnel)</label>
                            <input type="text" id="title_ht" name="title_ht" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="content">Contenu</label>
                            <textarea id="content" name="content" class="form-control" rows="6" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="content_ht">Contenu (créole, optionnel)</label>
                            <textarea id="content_ht" name="content_ht" class="form-control" rows="4"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="update_type">Type</label>
                            <select id="update_type" name="update_type" class="form-select">
                                <option value="general">Général</option>
                                <option value="harvest">Récolte</option>
                                <option value="problem">Difficulté</option>
                                <option value="milestone">Étape franchie</option>
                            </select>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="is_important" name="is_important">
                            <label class="form-check-label" for="is_important">Mise à jour importante</label>
                        </div>
                        <div class="form-check mb-3">
                            <input type="checkbox" class="form-check-input" id="notify_investors" name="notify_investors" checked>
                            <label class="form-check-label" for="notify_investors">Prévenir les investisseurs</label>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Publier</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
