name: CI PostgreSQL

# Les tests rapides tournent sur SQLite. Ce job rejoue tout sur PostgreSQL 16, la base de production :
# longueurs de colonnes, verrous de ligne, migrations, et absence d'écart entre modèles et migrations.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agrinvest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-only-secret
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agrinvest_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - run: pip install -r requirements.txt pytest pyflakes
      - name: Les migrations s'appliquent sur une base vide
        run: flask --app run db upgrade
      - name: Aucun écart entre les modèles et les migrations
        run: flask --app run db check
      - name: Suite de tests complète sur PostgreSQL
        run: pytest tests -q
