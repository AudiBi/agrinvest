name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev libcairo2-dev pkg-config
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests -q
